[build-system]
requires = ["setuptools>=77,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "IsoPhotonIX"
version = "0.13.0a2"
description = "Local photonics design, electromagnetic simulation and reproducible exports"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = "MIT"
license-files = ["LICENSE"]
dynamic = ["dependencies"]

[project.urls]
Repository = "https://github.com/srinjoyganguly/IsoPhotonIX"
Documentation = "https://github.com/srinjoyganguly/IsoPhotonIX/blob/main/docs/PACKAGING.md"

[project.scripts]
isophotonix = "isophotonix.cli:main"
# Keep existing launch scripts and exported command lines operational.
photonics-workbench = "isophotonix.cli:main"

[tool.setuptools]
packages = ["isophotonix", "photonics_workbench"]
package-dir = {"" = "src"}
include-package-data = false

[tool.setuptools.dynamic]
dependencies = {file = "requirements-api.txt"}
