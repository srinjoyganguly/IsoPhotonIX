[build-system]
requires = ["setuptools>=77,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "photonics-workbench"
version = "0.13.0a1"
description = "Local photonics design, electromagnetic simulation and reproducible exports"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = "MIT"
license-files = ["LICENSE"]
dynamic = ["dependencies"]

[project.scripts]
photonics-workbench = "photonics_workbench.cli:main"

[tool.setuptools]
packages = ["photonics_workbench"]
package-dir = {"" = "src"}
include-package-data = false

[tool.setuptools.dynamic]
dependencies = {file = "requirements-api.txt"}
